    q: "The x86 condition 'G, NLE' tests for:",
    opts: ["Less than (signed)", "Less than or equal", "Greater than / Not less than or equal (signed)", "Greater than or equal (unsigned)"],
    ans: 2
  },

  // ── ARM Operation Types ──────────────────────────────────────
  {
    q: "Which of the following is an ARM operation type?",
    opts: ["Far pointer access", "Load and store instructions", "Segment override", "Interrupt gate"],
    ans: 1
  },
  {
    q: "ARM does NOT include which of the following instruction categories?",
    opts: ["Branch instructions", "Data-processing instructions", "Far pointer instructions", "Multiply instructions"],
    ans: 2
  },
  {
    q: "ARM Conditions for Conditional Instruction Execution: code 0000 (EQ) tests condition:",
    opts: ["N = 1", "Z = 0", "Z = 1", "C = 1"],
    ans: 2
  },
  {
    q: "ARM condition code AL (1110) means:",
    opts: ["Always (unconditional)", "Signed less than", "Not equal", "Carry clear"],
    ans: 0
  },
  {
    q: "ARM condition NE (0001) tests:",
    opts: ["Z = 1", "Z = 0", "N = 1", "C = 1"],
    ans: 1
  },
  {
    q: "ARM condition GE (1010) means:",
    opts: ["Unsigned higher", "Signed greater than or equal", "Minus/negative", "Carry set"],
    ans: 1
  }
];

// Shuffle options while preserving correct answer tracking
function buildQuiz() {
  const container = document.getElementById('quiz');
  questions.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q${idx}`;

    const opts = item.opts.map((o, i) => ({ text: o, original: i }));

    card.innerHTML = `
      <div class="q-number">Question ${idx + 1} of ${questions.length}</div>
      <div class="q-text">${item.q}</div>
      <div class="options" id="opts${idx}">
        ${opts.map((o, i) => `
          <div class="option" id="opt${idx}_${o.original}">
            <label>
              <input type="radio" name="q${idx}" value="${o.original}">
              <span>${String.fromCharCode(65+i)}. ${o.text}</span>
            </label>
          </div>`).join('')}
      </div>
      <div class="feedback" id="fb${idx}"></div>
    `;
    container.appendChild(card);
  });
}

function checkAll() {
  let score = 0;
  questions.forEach((item, idx) => {
    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
    const card = document.getElementById(`q${idx}`);
    const fb = document.getElementById(`fb${idx}`);

    // disable all radios
    document.querySelectorAll(`input[name="q${idx}"]`).forEach(r => r.disabled = true);

    const correctOpt = document.getElementById(`opt${idx}_${item.ans}`);

    if (selected) {
      const val = parseInt(selected.value);
      if (val === item.ans) {
        score++;
        card.classList.add('correct');
        fb.textContent = '✔ Correct!';
        fb.className = 'feedback show correct-fb';
      } else {
        card.classList.add('wrong');
        fb.textContent = `✘ Wrong. Correct answer: ${String.fromCharCode(65 + item.ans)}. ${item.opts[item.ans]}`;
        fb.className = 'feedback show wrong-fb';
        document.getElementById(`opt${idx}_${val}`).classList.add('wrong-option');
      }
    } else {
      card.classList.add('wrong');
      fb.textContent = `⚠ Not answered. Correct: ${String.fromCharCode(65 + item.ans)}. ${item.opts[item.ans]}`;
      fb.className = 'feedback show wrong-fb';
    }
    correctOpt.classList.add('correct-option');
  });

  const scoreEl = document.getElementById('score');
  scoreEl.textContent = `Score: ${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;
  scoreEl.style.display = 'inline-block';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function resetAll() {
  document.getElementById('quiz').innerHTML = '';
  document.getElementById('score').style.display = 'none';
  buildQuiz();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

buildQuiz();
</script>
